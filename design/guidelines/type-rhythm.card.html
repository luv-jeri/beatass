<!-- @dsCard group="Type" viewport="700x200" name="The 30px rule" subtitle="Handwriting sits ON the printed rule. Change the line-height and this breaks." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="background:var(--paper-2);border:var(--bw-pen) solid var(--ink-faint);border-radius:var(--radius-pen-lg);padding:0 14px 8px;background-image:var(--bg-ruled-ink);background-position:0 0">
<div style="font-family:var(--font-ui);font-size:18px;line-height:30px;color:var(--ink)">You probably don't even remember doing it.<br>I do. Every single day. And I've never<br>once said it out loud to anyone.</div>
</div>
<div class="cap" style="margin-top:7px">--rule-h 30px · --rule-offset 4px on the page background</div></body></html>
