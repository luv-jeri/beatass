<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;gap:30px;align-items:center;color:var(--ink);padding:8px 0">
<div style="text-align:center"><img src="../assets/icons/fist.svg" alt="" style="width:34px;height:34px"><div class="cap" style="margin-top:8px">fist</div></div><div style="text-align:center"><img src="../assets/icons/pin.svg" alt="" style="width:34px;height:34px"><div class="cap" style="margin-top:8px">pin</div></div><div style="text-align:center"><img src="../assets/icons/flame.svg" alt="" style="width:34px;height:34px"><div class="cap" style="margin-top:8px">flame</div></div><div style="text-align:center"><img src="../assets/icons/heart.svg" alt="" style="width:34px;height:34px"><div class="cap" style="margin-top:8px">heart</div></div>
<div style="text-align:center"><img src="../assets/icons/plane.svg" alt="" style="width:62px"><div class="cap" style="margin-top:8px">plane</div></div>
<div style="text-align:center"><img src="../assets/icons/doll.svg" alt="" style="width:30px"><div class="cap" style="margin-top:8px">doll</div></div>
<div style="margin-left:auto;text-align:center"><img src="../assets/icons/fist.svg" alt="" style="width:34px;height:34px;color:var(--red)"><div class="cap" style="margin-top:8px">red pen</div></div>
</div></body></html>
