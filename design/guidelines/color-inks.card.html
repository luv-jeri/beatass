<!-- @dsCard group="Colors" viewport="700x150" name="Three inks" subtitle="Ballpoint blue for text, red pen for labels, highlighter for emphasis — no fourth accent" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--ink)"></i><b>ballpoint blue</b><code>--ink · #26356e</code></div>
<div class="sw"><i style="background:var(--red)"></i><b>red pen</b><code>--red · #cf3a2d</code></div>
<div class="sw"><i style="background:var(--hl)"></i><b>highlighter</b><code>--hl · #ffe873</code></div>
</div></body></html>
