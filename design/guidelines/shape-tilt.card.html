<!-- @dsCard group="Shape" viewport="700x170" name="Nothing sits straight" subtitle="Every element is rotated a fraction of a degree off true" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;gap:16px;align-items:center;justify-content:space-between;padding:10px 0">
<div style="text-align:center"><div style="transform:rotate(-1.4deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">-1.4°</div><div class="cap" style="margin-top:7px">logo</div></div><div style="text-align:center"><div style="transform:rotate(0.6deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">+0.6°</div><div class="cap" style="margin-top:7px">tagline</div></div><div style="text-align:center"><div style="transform:rotate(0.5deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">+0.5°</div><div class="cap" style="margin-top:7px">overlay card</div></div><div style="text-align:center"><div style="transform:rotate(1.2deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">+1.2°</div><div class="cap" style="margin-top:7px">chip odd</div></div><div style="text-align:center"><div style="transform:rotate(-1.6deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">-1.6°</div><div class="cap" style="margin-top:7px">chip even</div></div><div style="text-align:center"><div style="transform:rotate(-2deg);background:var(--sticky);box-shadow:var(--shadow-chip);padding:5px 11px;font-family:var(--font-script);font-weight:700;font-size:16px">-2°</div><div class="cap" style="margin-top:7px">chip on</div></div>
</div></body></html>
