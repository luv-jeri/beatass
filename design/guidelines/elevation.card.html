<!-- @dsCard group="Shape" viewport="700x190" name="Two shadow systems" subtitle="Hard offset for buttons (a doodle's shadow); soft blur for real objects on the desk" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;gap:26px;align-items:center;padding:14px 4px 22px">
<div style="text-align:center"><div style="display:inline-block;background:var(--red);color:var(--paper-2);font-family:var(--font-ui);font-weight:700;font-size:16px;padding:9px 20px 10px;border:2.5px solid var(--red);border-radius:var(--radius-pen-btn);box-shadow:var(--shadow-btn-red)">Send it</div><div class="cap" style="margin-top:9px">3px 4px 0 · rest</div></div>
<div style="text-align:center"><div style="display:inline-block;background:var(--red);color:var(--paper-2);font-family:var(--font-ui);font-weight:700;font-size:16px;padding:9px 20px 10px;border:2.5px solid var(--red);border-radius:var(--radius-pen-btn);box-shadow:var(--shadow-btn-red-hover);transform:var(--hover-lift)">Send it</div><div class="cap" style="margin-top:9px">5px 7px 0 · hover</div></div>
<div style="text-align:center"><div style="display:inline-block;background:var(--red);color:var(--paper-2);font-family:var(--font-ui);font-weight:700;font-size:16px;padding:9px 20px 10px;border:2.5px solid var(--red);border-radius:var(--radius-pen-btn);box-shadow:var(--shadow-btn-red-active);transform:var(--press-shift)">Send it</div><div class="cap" style="margin-top:9px">1px 1px 0 · press</div></div>
<div style="text-align:center;margin-left:auto"><div style="width:110px;height:56px;background:#fff;box-shadow:var(--shadow-taped);transform:rotate(.5deg)"></div><div class="cap" style="margin-top:11px">--shadow-taped</div></div>
</div></body></html>
