<!-- @dsCard group="Brand" viewport="700x200" name="Interaction states" subtitle="Hover lifts and tilts, press lands, selected goes red over a highlighter wash" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--pencil)">
<div style="display:flex;gap:22px;align-items:center"><span style="width:70px" class="cap">tool rest</span><span style="border:2px solid transparent;padding:5px 14px;border-radius:var(--radius-pen-md);font-family:var(--font-script);font-weight:700;font-size:16px;color:var(--ink)">Punch</span>
<span style="width:56px" class="cap">hover</span><span style="border:2px solid var(--ink-faint);padding:5px 14px;border-radius:var(--radius-pen-md);font-family:var(--font-script);font-weight:700;font-size:16px;color:var(--ink)">Punch</span>
<span style="width:66px" class="cap">selected</span><span style="border:2px solid var(--red);background:rgba(255,232,115,.55);padding:5px 14px;border-radius:var(--radius-pen-md);font-family:var(--font-script);font-weight:700;font-size:16px;color:var(--red)">Punch</span></div>
<div style="display:flex;gap:22px;align-items:center"><span style="width:70px" class="cap">chip rest</span><span style="background:var(--sticky);box-shadow:var(--shadow-chip);transform:rotate(1.2deg);padding:4px 12px;font-family:var(--font-script);font-weight:700;font-size:16px">grudge</span>
<span style="width:56px" class="cap">on</span><span style="background:var(--hl-pink);box-shadow:var(--shadow-chip);transform:rotate(-2deg) scale(1.05);padding:4px 12px;font-family:var(--font-script);font-weight:700;font-size:16px">grudge</span>
<span style="width:66px" class="cap">disabled</span><span style="opacity:.4;background:var(--red);color:var(--paper-2);font-family:var(--font-ui);font-weight:700;font-size:15px;padding:9px 15px;border:2.5px solid var(--red);border-radius:var(--radius-pen-btn)">Send it</span></div>
</div></body></html>
