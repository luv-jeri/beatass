<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Fast, small, physical — and the 110ms boil that defines the brand" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;flex-direction:column;gap:9px;font-size:14px">
<div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">press</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.12s</code><span style="color:var(--pencil);font-size:13px">button lands on the paper</span></div><div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">tool</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.14s</code><span style="color:var(--pencil);font-size:13px">selection border appears</span></div><div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">error</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.15s</code><span style="color:var(--pencil);font-size:13px">red message fades in</span></div><div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">gauge</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.2s</code><span style="color:var(--pencil);font-size:13px">damage fills</span></div><div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">hint</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.3s</code><span style="color:var(--pencil);font-size:13px">fades out on first touch</span></div><div style="display:flex;gap:12px;align-items:baseline"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">overlay</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">.25s cubic-bezier(.2,.9,.3,1)</code><span style="color:var(--pencil);font-size:13px">pops from translateY(12px) rotate(.6deg)</span></div>
<div style="display:flex;gap:12px;align-items:baseline;border-top:2px dotted var(--ink-faint);padding-top:8px;margin-top:2px"><b style="width:74px;font-family:var(--font-marker);font-weight:400;font-size:13px;color:var(--red)">boil</b><code style="font-family:ui-monospace,monospace;font-size:11px;width:210px">110ms</code><span style="color:var(--pencil);font-size:13px">every stroke drawn twice, wobble re-rolled ~9&times;/sec</span></div>
</div></body></html>
