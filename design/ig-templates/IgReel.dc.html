<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- handoff reference copy · @source-template name="IG reel kit — cover / lower-third / end" description="1080×1920 · three stills, tone-styled · the clean square recording taped into the lower-third" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div id="canvas" class="tone-{{tone}} frame-{{frame}}" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:#fbf7ea;background-image:repeating-linear-gradient(transparent 0 52px,#cddaea 52px 54px);font-family:'Hand',cursive;color:#26356e">
<sc-if value="{{isCrush}}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:rgba(255,185,207,.14)"></div></sc-if>
<sc-if value="{{isGrudge}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:rgba(38,53,110,.05)"></div></sc-if>
<sc-if value="{{isApology}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:rgba(255,253,245,.55)"></div></sc-if>
<sc-if value="{{isRoast}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:rgba(255,232,115,.12)"></div></sc-if>
<sc-if value="{{isCover}}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;top:0;bottom:0;left:88px;width:3px;background:#e3a8a2"></div>
<img src="../../assets/brand/svg/wordmark.svg" alt="beatass" style="position:absolute;left:122px;top:292px;width:200px">
<div id="message" style="position:absolute;left:122px;top:540px;width:840px;font-size:{{coverSize}}px;line-height:1.24;text-wrap:pretty;z-index:2">{{message}}</div>
<sc-if value="{{hasSticker}}" hint-placeholder-val="{{ true }}"><img src="{{stickerSrc}}" alt="" style="position:absolute;right:430px;top:1130px;width:180px;z-index:2"></sc-if>
<img src="{{dollSrc}}" alt="" style="position:absolute;right:130px;top:1128px;width:300px;z-index:3">
<div id="annotation" style="position:absolute;left:122px;top:1440px;font-family:'Scrawl',cursive;font-size:46px;font-weight:700;color:#cf3a2d;transform:rotate(-1.5deg);z-index:4">{{annText}}</div>
</sc-if>
<sc-if value="{{isLower}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#e8e0cc;background-image:repeating-linear-gradient(45deg,rgba(141,135,120,.16) 0 3px,transparent 3px 28px)"></div>
<div style="position:absolute;left:90px;top:560px;width:400px;font-family:'Scrawl',cursive;font-size:36px;color:#8d8778;transform:rotate(-1deg)">the beating video plays full-screen behind this</div><div style="position:absolute;right:70px;top:600px;width:471px;background:#fffdf5;border:3.5px solid #26356e;border-radius:14px 7px 18px 9px;transform:rotate(1.2deg);z-index:2;padding:12px;box-sizing:border-box"><div id="media" style="position:relative;width:440px;height:440px;background:#fbf7ea;overflow:hidden"><div style="position:absolute;inset:10px;border:2.5px dashed #8d8778;border-radius:12px 6px 14px 8px"></div><img src="../../assets/brand/svg/doll-blink.svg" alt="" style="position:absolute;left:158px;top:92px;width:124px"><div style="position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:24px;color:#8d8778">the clean square recording · 440×440</div></div></div><div style="position:absolute;right:400px;top:580px;width:150px;height:38px;background:rgba(255,232,115,.8);transform:rotate(-4deg);border-radius:4px;z-index:3"></div><div style="position:absolute;right:40px;top:1028px;width:150px;height:38px;background:rgba(255,232,115,.8);transform:rotate(4deg);border-radius:4px;z-index:3"></div>
<img src="../../assets/brand/svg/wordmark.svg" alt="beatass" style="position:absolute;left:110px;top:280px;width:170px">
<img src="{{dollSrc}}" alt="" style="position:absolute;left:120px;top:930px;width:200px;z-index:3">
<div style="position:absolute;left:70px;top:1180px;width:940px;height:390px;background:#fffdf5;border:3.5px solid #26356e;border-radius:22px 9px 26px 12px;transform:rotate(-.8deg);z-index:2;display:flex;align-items:center;padding:50px 60px;box-sizing:border-box">
<div id="message" style="width:100%;font-size:{{lowerSize}}px;line-height:1.3;text-wrap:pretty">{{message}}</div>
</div>
<div style="position:absolute;left:440px;top:1162px;width:190px;height:42px;background:rgba(255,232,115,.75);transform:rotate(-3deg);border-radius:4px;z-index:3"></div>
<div id="annotation" style="position:absolute;right:96px;top:1100px;font-family:'Scrawl',cursive;font-size:42px;font-weight:700;color:#cf3a2d;transform:rotate(-2deg);z-index:4">{{annText}}</div>
</sc-if>
<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<img src="../../assets/brand/svg/lockup-stacked.svg" alt="beatass" style="position:absolute;left:340px;top:400px;width:400px">
<div style="position:absolute;left:0;right:0;top:1030px;text-align:center;font-family:'Scrawl',cursive;font-size:56px;font-weight:700;color:#26356e">say the thing you'd <span style="background:rgba(255,232,115,.85);padding:2px 14px 6px;border-radius:10px 16px 12px 18px">never say</span></div>
<div style="position:absolute;left:0;right:0;top:1170px;text-align:center;font-family:'Marker',cursive;font-size:44px">beat<span style="color:#cf3a2d">ass</span><span style="color:#8d8778;font-family:'Hand',cursive;font-size:32px">.com</span></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;cover&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;lowerthird&quot;,&quot;end&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;crush&quot;,&quot;options&quot;:[&quot;crush&quot;,&quot;grudge&quot;,&quot;apology&quot;,&quot;roast&quot;,&quot;thanks&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;message&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;you never once said thank you. not once in three years.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;annotation&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'crush';
    const frame = this.props.frame ?? 'cover';
    const msg = this.props.message ?? 'you never once said thank you. not once in three years.';
    const ANN = { crush: "don't make it weird", grudge: 'you know what you did', apology: 'i mean every word', roast: 'anonymous, obviously', thanks: 'for real. thank you.' };
    const DOLL = { crush: 'doll-loved', grudge: 'doll-hurt', apology: 'doll-flinch', roast: 'doll-panic', thanks: 'doll-default' };
    const STICK = { crush: 'sticker-hearts', grudge: 'sticker-pins', roast: 'sticker-flames', thanks: 'sticker-stars' };
    const len = msg.length;
    const cbase = len <= 24 ? 150 : len <= 48 ? 118 : len <= 90 ? 92 : len <= 140 ? 74 : 60;
    return {
      tone, frame, message: msg,
      annText: this.props.annotation || (frame === 'cover' ? 'watch him take it →' : ANN[tone] || ANN.roast),
      coverSize: Math.round(cbase * (tone === 'roast' ? 1.15 : tone === 'apology' ? .85 : 1)),
      lowerSize: len <= 60 ? 60 : len <= 120 ? 50 : 42,
      dollSrc: '../../assets/brand/svg/' + DOLL[tone] + '.svg',
      hasSticker: !!STICK[tone],
      stickerSrc: '../../assets/brand/svg/' + (STICK[tone] || 'sticker-stars') + '.svg',
      isCrush: tone === 'crush', isGrudge: tone === 'grudge', isApology: tone === 'apology', isRoast: tone === 'roast', isThanks: tone === 'thanks',
      isCover: frame === 'cover', isLower: frame === 'lowerthird', isEnd: frame === 'end'
    };
  }
}
</script>
</body>
</html>
