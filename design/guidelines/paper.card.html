<!-- @dsCard group="Brand" viewport="700x190" name="Paper &amp; grain" subtitle="Feint rules offset 4px, a fixed SVG turbulence grain, and the canvas grid" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;gap:14px;height:126px">
<div style="flex:1;position:relative;background:var(--paper);background-image:var(--bg-ruled);background-position:0 var(--rule-offset);border:var(--bw-pen) solid var(--ink-faint);border-radius:var(--radius-pen-sm);overflow:hidden"><div style="position:absolute;inset:0;opacity:var(--grain-opacity);background-image:var(--bg-grain)"></div><div style="position:absolute;top:0;bottom:0;left:22px;width:2px;background:var(--margin-line);opacity:.7"></div><span class="cap" style="position:absolute;bottom:6px;left:30px">page + rules + margin + grain</span></div>
<div style="flex:1;position:relative;background:var(--paper-2);border:var(--bw-pen-heavy) solid var(--ink);border-radius:var(--radius-pen-lg);overflow:hidden;background-image:repeating-linear-gradient(to right,transparent 0,transparent 21px,var(--rule) 21px,var(--rule) 22px),repeating-linear-gradient(to bottom,transparent 0,transparent 21px,var(--rule) 21px,var(--rule) 22px)"><span class="cap" style="position:absolute;bottom:6px;left:10px">canvas · 22px grid</span></div>
</div></body></html>
