<!-- @dsCard group="Type" viewport="700x210" name="Script faces — the fun bits only" subtitle="Permanent Marker, Caveat, Patrick Hand. Logo, tagline, chips, impact words, handwriting." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;flex-direction:column;gap:13px">
<div><div class="cap">Marker · --font-marker · logo, section labels, POW</div>
<div style="font-family:var(--font-marker);font-size:34px;line-height:1.05">beat<span style="color:var(--red)">ass</span> &nbsp;<span style="font-size:22px">POW · THWACK · OW</span></div></div>
<div><div class="cap">Caveat 700 · --font-script · tagline, field labels, impact words</div>
<div style="font-family:var(--font-script);font-weight:700;font-size:30px;line-height:1.05">say the thing you'd never say</div></div>
<div><div class="cap">Patrick Hand · --font-hand · decorative notes only — never the confession</div>
<div style="font-family:var(--font-hand);font-size:20px;line-height:30px">I've been holding this in for two years…</div></div>
</div></body></html>
