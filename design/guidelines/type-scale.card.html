<!-- @dsCard group="Type" viewport="700x180" name="Size ladder" subtitle="Every value the product actually uses — nothing rounded to a grid" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline">
<div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:11px;line-height:1.1">11</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-micro</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:12px;line-height:1.1">12</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-tiny</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:13px;line-height:1.1">13</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-caption</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;line-height:1.1">14</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-small</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;line-height:1.1">15</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-note</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:16px;line-height:1.1">16</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-ui</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:17px;line-height:1.1">17</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-body</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:18px;line-height:1.1">18</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-input</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:19px;line-height:1.1">19</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-label</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:22px;line-height:1.1">22</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-lead</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:26px;line-height:1.1">26</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-impact</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:29px;line-height:1.1">29</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-logo</code></div><div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:44px;line-height:1.1">44</span><code style="font-family:ui-monospace,monospace;font-size:9.5px;color:var(--pencil)">--fs-display</code></div>
</div></body></html>
