<!-- @dsCard group="Shape" viewport="700x190" name="Nothing is a perfect rectangle" subtitle="Four mismatched corners per box — that's what makes it read as pen-drawn" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:78px;border:var(--bw-pen-heavy) solid var(--ink);background:var(--paper-2);border-radius:var(--radius-pen-lg)"></div><code style="font-family:ui-monospace,monospace;font-size:10px;color:var(--ink)">--radius-pen-lg</code><span class="cap">frames, cards</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:78px;border:var(--bw-pen-heavy) solid var(--ink);background:var(--paper-2);border-radius:var(--radius-pen-md)"></div><code style="font-family:ui-monospace,monospace;font-size:10px;color:var(--ink)">--radius-pen-md</code><span class="cap">tool tiles</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:78px;border:var(--bw-pen-heavy) solid var(--ink);background:var(--paper-2);border-radius:var(--radius-pen-btn)"></div><code style="font-family:ui-monospace,monospace;font-size:10px;color:var(--ink)">--radius-pen-btn</code><span class="cap">buttons</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:78px;border:var(--bw-pen-heavy) solid var(--ink);background:var(--paper-2);border-radius:var(--radius-pen-sm)"></div><code style="font-family:ui-monospace,monospace;font-size:10px;color:var(--ink)">--radius-pen-sm</code><span class="cap">gauges</span></div>
</div></body></html>
