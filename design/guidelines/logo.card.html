<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="The current mark — flagged for redrawing so the string reads as a puppet, not a noose" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);font-family:var(--font-ui);color:var(--ink);padding:16px 18px}
.g{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 0;min-width:0;border:var(--bw-pen) solid var(--ink);border-radius:var(--radius-pen-sm);overflow:hidden}
.sw i{display:block;height:52px}
.sw b{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;padding:5px 7px 1px;line-height:1.25}
.sw code{display:block;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--pencil);padding:0 7px 6px}
.cap{font-family:var(--font-marker);font-size:11px;color:var(--pencil)}
a{color:var(--red)}a:hover{color:var(--ink)}</style></head><body><div style="display:flex;align-items:center;gap:34px">
<div style="display:flex;align-items:center;gap:10px;transform:rotate(-1.4deg);color:var(--ink)"><img src="../assets/logo.svg" alt="" style="width:44px;height:auto"><span style="font-family:var(--font-marker);font-size:38px;line-height:1">beat<span style="color:var(--red)">ass</span></span></div>
<div style="display:flex;align-items:center;gap:10px;transform:rotate(-1.4deg);color:var(--paper-2);background:var(--ink);padding:12px 16px"><img src="../assets/logo.svg" alt="" style="width:26px;height:auto;filter:invert(1) sepia(1) saturate(0) brightness(1.7)"><span style="font-family:var(--font-marker);font-size:23px;line-height:1">beat<span style="color:var(--hl)">ass</span></span></div>
<div style="font-size:13px;color:var(--pencil);max-width:24ch;line-height:1.35">⚠ Not redrawn. The string attaches at the neck; the fix is to attach it to the back or head.</div>
</div></body></html>
